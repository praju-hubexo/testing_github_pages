<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time & Greeting API - Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #fafafa;
        }
        .topbar {
            background-color: #389f8f;
            padding: 10px 0;
            text-align: center;
            color: white;
        }
        .topbar h1 {
            margin: 0;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>⏰ Time & Greeting API</h1>
    </div>
    <div id="swagger-ui"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.15.5/swagger-ui-bundle.min.js"></script>
    <script>
        const ui = SwaggerUIBundle({
            url: "https://raw.githubusercontent.com/praju-hubexo/testing_github_pages/main/openapi.json",
            dom_id: '#swagger-ui',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIBundle.SwaggerUIStandalonePreset
            ],
            layout: "BaseLayout",
            onComplete: function() {
                console.log("Swagger UI loaded successfully");
            },
            onFailure: function(error) {
                console.error("Error loading Swagger UI:", error);
                // Fallback message
                document.getElementById('swagger-ui').innerHTML = '<h2 style="text-align: center; padding: 20px; color: #d32f2f;">Failed to load API specification. Make sure openapi.json is available.</h2>';
            }
        });
    </script>
</body>
</html>
