<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Testing GitHub Pages — Demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:2rem;background:#f7f7f8}
    .card{border:1px solid #e1e4e8;background:#fff;padding:1.25rem;border-radius:8px;max-width:820px}
    button{padding:0.5rem 0.75rem;border-radius:6px;border:1px solid #d0d7de;background:#fafbfc;cursor:pointer}
    button:active{transform:translateY(1px)}
    p small{color:#666}
  </style>
</head>
<body>
  <h1>Testing GitHub Pages — Demo</h1>
  <div class="card">
    <p>Current time: <strong id="time">--:--:--</strong></p>
    <p>Run count: <strong id="runCount">0</strong></p>
    <p><button id="runBtn">Run code</button></p>

    <hr>

    <p>GitHub username: <strong id="ghUser">unknown</strong></p>
    <p id="ghNote"><small>I'll attempt to detect your GitHub username if you're logged into github.com in this browser. Detection may fail if cross-origin credentialed requests are blocked by the browser or by GitHub's CORS policy.</small></p>
    <p><button id="detectBtn">Try detect GitHub username</button></p>

    <p id="status" aria-live="polite"></p>
  </div>

  <script>
    // Update the displayed current time every second
    function updateTime(){
      const el = document.getElementById('time');
      const now = new Date();
      el.textContent = now.toLocaleString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Run counter stored in localStorage so the page "runs code" and remembers count per browser
    const runKey = 'testing_github_pages_run_count_v1';
    const runEl = document.getElementById('runCount');
    function loadRunCount(){ return parseInt(localStorage.getItem(runKey) || '0', 10); }
    function setRunCount(n){ localStorage.setItem(runKey, String(n)); runEl.textContent = n; }
    setRunCount(loadRunCount());
    document.getElementById('runBtn').addEventListener('click', () => {
      const n = loadRunCount() + 1;
      setRunCount(n);
      const status = document.getElementById('status');
      status.textContent = 'Ran code at ' + new Date().toLocaleTimeString();
      setTimeout(()=> status.textContent = '', 3000);
    });

    // Attempt to detect the logged-in GitHub user by calling the GitHub API with credentials included.
    // Note: This may fail due to CORS or because the API requires explicit auth tokens. We handle fallbacks gracefully.
    async function detectGitHubUser(){
      const ghUserEl = document.getElementById('ghUser');
      const status = document.getElementById('status');
      status.textContent = 'Checking GitHub...';
      try{
        const resp = await fetch('https://api.github.com/user', { credentials: 'include' });
        if (resp.ok){
          const data = await resp.json();
          if (data && data.login){
            ghUserEl.textContent = data.login;
            status.textContent = 'Detected GitHub user.';
            return;
          }
        } else if (resp.status === 401){
          status.textContent = 'Not authenticated to the GitHub API (401). You are likely not logged in or the request is blocked.';
        } else {
          status.textContent = 'GitHub API returned status ' + resp.status + '. Detection may be blocked by CORS or require authentication.';
        }
      } catch(err){
        status.textContent = 'Error accessing GitHub API: ' + err.message;
      }
      ghUserEl.textContent = 'Not detected';
    }

    document.getElementById('detectBtn').addEventListener('click', detectGitHubUser);
    // Try once automatically when page loads
    detectGitHubUser();
  </script>
</body>
</html>
